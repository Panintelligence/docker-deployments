version: "3.0"
services:
  dashboard:
    profiles:
      - dashboard
      - full
    image: ${DASHBOARD_IMAGE}
    ports:
      - 8224:8224
    environment:
      PI_DB_HOST: database
      PI_DB_PASSWORD: panintelligence
      PI_DB_USERNAME: root
      PI_DB_SCHEMA_NAME: dashboard
      PI_DB_PORT: 3306
      PI_EXTERNAL_DB: "true"
      PI_LICENCE: ${LICENCE}
      PI_TOMCAT_MAX_MEMORY: 1792 # Set the maximum memory to a size suitable for your environment or use PI_TOMCAT_MAX_MEMORY_PERCENTAGE with a value between 20 and 60.
      PI_ADDITIONAL_SERVICES_PI_CALLBACK_URL: http://dashboard:28748/pi # Using this port helps to avoid issues with self signed https certificates, but don't expose it. If you use genuine trusted certificates you should the main app port instead.
      PI_VARIABLE_PAN_RENDERER_URL: http://renderer:9915
      PI_VARIABLE_PAN_SCHEDULER_URL: http://scheduler:9917
      PI_VARIABLE_ANALYTICS_SERVER_URL: http://pirana:9918
      PI_VARIABLE_PI_AI_URL: http://pi-ai:9919
    restart: unless-stopped
    volumes:
      - panintelligence_keys:/var/panintelligence/Dashboard/keys/
  renderer:
    profiles:
      - renderer
      - full
    image: ${RENDERER_IMAGE}
    environment:
      RENDERER_LOG_LEVELS: info,error,warn,verbose,debug
    restart: unless-stopped
  pirana:
    profiles:
      - pirana
      - full
    image: ${PIRANA_IMAGE}
    restart: unless-stopped
  scheduler:
    profiles:
      - scheduler
      - full
    image: ${SCHEDULER_IMAGE}
    environment:
      SCHEDULER_DASHBOARD_URL: http://dashboard:8224/pi
      PI_DB_HOST: database
      PI_DB_PASSWORD: panintelligence
      PI_DB_USERNAME: root
      PI_DB_SCHEMA_NAME: dashboard
      PI_DB_PORT: 3306
    restart: unless-stopped
    volumes:
      - panintelligence_keys:/var/panintelligence/Dashboard/keys/
  pi-ai:
    profiles:
      - pi-ai
      - full
    image: ${PI_AI_IMAGE}
    environment:
      PI_AI_PORT: 9919
      PI_AI_ALLOWED_URLS: http://dashboard:28748
  database:
    profiles:
      - database
      - full
    image: docker.io/mariadb:${MARIADB_VERSION}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: dashboard
      LANG: C.UTF-8
    command: --lower_case_table_names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
      - ./database_import:/docker-entrypoint-initdb.d # Use this to a SQL dump automatically from the folder (only for a new db_data volume)
volumes:
  db_data:
  panintelligence_keys:
